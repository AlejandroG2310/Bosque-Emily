name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot

      - name: Importar assets
        run: ./godot --headless --path . --import

      - name: Modo Livre
        run: ./godot --headless --path . res://tools/tests/test_free_mode.tscn

      - name: Regras dos fundos em vídeo
        run: ./godot --headless --path . res://tools/tests/test_video_rules.tscn

      - name: Traduções completas
        run: ./godot --headless --path . res://tools/tests/test_translations.tscn

      - name: Orientação em paisagem
        run: ./godot --headless --path . --script res://tools/tests/test_orientation.gd

      - name: Alcance do AAB (API 24 e três ABIs)
        run: ./godot --headless --path . --script res://tools/tests/test_android_reach.gd
